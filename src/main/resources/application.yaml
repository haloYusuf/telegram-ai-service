server:
  port: ${SERVER_PORT}

spring:
  application:
    name: telegram-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL}
  data:
    # MongoDB Database
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE}
    # Redis Cache & PubSub
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT}

# Security
security:
  api-key: ${API_KEY}

# Telegram Bot API & Webhook
telegram:
  api-url: ${TELEGRAM_API_URL}
  webhook-base-url: ${TELEGRAM_WEBHOOK_BASE_URL}

# Gemini AI Configuration
gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL}
  base-url: ${GEMINI_BASE_URL}

# MinIO Storage
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}

# Agentic AI Debounce Buffer
agentic:
  buffer:
    ttl-seconds: ${AGENTIC_BUFFER_TTL_SECONDS}

# Swagger UI & OpenAPI 3 Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
